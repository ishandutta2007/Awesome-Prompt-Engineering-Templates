<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#3b82f6;#6366f1;#a855f7" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#8b5cf6;#ec4899;#38bdf8" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Radial Gradients -->
    <radialGradient id="glowPurple" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1.5" fill="#64748b" fill-opacity="0.35" />
    </pattern>

    <!-- Filter for Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .mono-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    .animated-float-1 {
      animation: floatSlow1 7s ease-in-out infinite;
    }
    .animated-float-2 {
      animation: floatSlow2 8.5s ease-in-out infinite;
    }
    .pulsing-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 50% 50%;
    }
  </style>

  <!-- 1. Background Layers -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#techGrid)" rx="16" />

  <!-- 2. Ambient Background Glows (behind text) -->
  <circle cx="350" cy="180" r="280" fill="url(#glowPurple)" class="pulsing-glow" />
  <circle cx="950" cy="220" r="240" fill="url(#glowCyan)" class="pulsing-glow" style="animation-delay: -3s;" />

  <!-- 3. Dynamic Decorative Floating Chips in Background -->
  <!-- Chip 1: System Tag -->
  <g class="animated-float-1" transform="translate(80, 75)">
    <rect width="180" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.65" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="90" y="20" fill="#a5b4fc" text-anchor="middle" class="mono-tag">&lt;system_prompt&gt;</text>
  </g>

  <!-- Chip 2: Variable Syntax -->
  <g class="animated-float-2" transform="translate(940, 70)">
    <rect width="190" height="32" rx="16" fill="#14294b" fill-opacity="0.65" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="95" y="20" fill="#7dd3fc" text-anchor="middle" class="mono-tag">{{variable:context}}</text>
  </g>

  <!-- Chip 3: Chain-of-Thought -->
  <g class="animated-float-2" transform="translate(70, 315)">
    <rect width="210" height="32" rx="16" fill="#1f1d36" fill-opacity="0.65" stroke="#c084fc" stroke-width="1.2" />
    <text x="105" y="20" fill="#e9d5ff" text-anchor="middle" class="mono-tag">⚡ Few-Shot CoT Engine</text>
  </g>

  <!-- Chip 4: Structured Output -->
  <g class="animated-float-1" transform="translate(920, 315)">
    <rect width="200" height="32" rx="16" fill="#11293a" fill-opacity="0.65" stroke="#10b981" stroke-width="1.2" />
    <text x="100" y="20" fill="#6ee7b7" text-anchor="middle" class="mono-tag">📦 Output: Schema[JSON]</text>
  </g>

  <!-- 4. Foreground Content (Z-indexed on top, never hidden) -->

  <!-- Top Badge / Category Indicator -->
  <g transform="translate(600, 70)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="url(#shimmerGradient)" stroke-width="1.5" />
    <text x="0" y="5" fill="#f8fafc" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.1em" font-family="system-ui, sans-serif">
      ✨ CURATED LLM &amp; PROMPT ECOSYSTEM ✨
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 165)">
    <!-- High-contrast crisp title -->
    <text x="0" y="0" text-anchor="middle" font-size="44" fill="#ffffff" class="title-text" filter="url(#softGlow)">
      Awesome Prompt Engineering &amp; Templates
    </text>
    <text x="0" y="0" text-anchor="middle" font-size="44" fill="url(#shimmerGradient)" class="title-text">
      Awesome Prompt Engineering &amp; Templates
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 220)">
    <text x="0" y="0" text-anchor="middle" font-size="17" fill="#cbd5e1" class="subtitle-text">
      The Ultimate Hub for Open-Source Registries, SaaS Platforms, Structured Frameworks &amp; LLMOps
    </text>
  </g>

  <!-- Interactive/Pill Feature Bar -->
  <g transform="translate(600, 280)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">🤖 170k+ Prompts</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-180, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">📐 Pattern Libraries</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">⚡ CI/CD Eval</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(180, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">🔒 Self-Hostable</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(360, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">🚀 Multi-Model</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#shimmerGradient)" stroke-width="1.2" stroke-opacity="0.4" />
</svg>
